# Menambahkan stack observabilitas (Prometheus, Loki, Tempo, Alloy, Grafana) di atas sistem yang sudah ada.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#
# Lalu buka http://localhost:3000. Penjelasan dan cara mencobanya ada di observability/README.md.
# Khusus untuk belajar dan demo lokal: Grafana tanpa login dan hanya bisa dibuka dari laptop ini (127.0.0.1).
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.6.16
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro

  # Pengumpul: membaca log semua container lewat socket Docker, dan menerima trace OTLP dari service.
  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki, tempo]

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard dibaca dari repo infra (harus berada di sebelah repo ini). Ganti lewat DASHBOARDS_DIR bila lokasinya lain.
      - ${DASHBOARDS_DIR:-../IF4031_chisli1_infra/platform/observability/dashboards}:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo]

  # --- Service aplikasi: cukup menunjuk kolektor trace. Port /metrics (9102) sudah aktif bawaan. ---
  aggregator:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  client-facing-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  auth-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  notifier:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  dashboard-updater:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  bmkg-mock:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  pvmbg-mock:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
